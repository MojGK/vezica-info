# Popis kategorija portala VEŽICA INFO.
# Novu kategoriju dodaj ovdje (name = točan naziv koji se piše u front matter, slug = sidro/filter bez dijakritika).
# U članku koristi:
#   location: Vežica
#   type: Crna kronika
#   categories: [Vežica, Crna kronika]

lokacije:
  - name: Vežica
    slug: vezica
  - name: Sveta Katarina
    slug: sveta-katarina
  - name: Pašac
    slug: pasac
  - name: Trsat
    slug: trsat
  - name: Drenova
    slug: drenova
  - name: Istočna Rijeka
    slug: istocna-rijeka

vrste:
  - name: Događanja
    slug: dogadanja
  - name: Crna kronika
    slug: crna-kronika
  - name: Sport
    slug: sport
  - name: Priroda
    slug: priroda
  - name: Promet
    slug: promet
  - name: Kultura
    slug: kultura
  - name: Zanimljivosti
    slug: zanimljivosti
  - name: Povijest
    slug: povijest
  # natječaji, javni pozivi, savjetovanja, komunalne obavijesti, odluke vijeća
  - name: Općinske vijesti
    slug: opcinske-vijesti
  # stanovništvo, demografija, obitelj, socijalne teme i analize
  - name: Društvo
    slug: drustvo
  # tjedni pregled oglasa za posao (stranica /zaposlenje/)
  - name: Zaposlenje
    slug: zaposlenje
  # aktualne vijesti koje ne spadaju u druge rubrike; ide u blok VIJESTI
  - name: Aktualno
    slug: aktualno
  # tjedni sažetak 5 najvažnijih vijesti (predložak: _drafts/predlozak-pregled-tjedna.md)
  - name: Pregled tjedna
    slug: pregled-tjedna

# Serijali – tematske serije članaka koje idu uz mjesto i vrstu.
# Članak je u serijalu ako mu `categories` sadrži točan naziv, npr.
#   categories: [Trsat, Povijest, POVIJEST VEŽICA]
serijali:
  - name: POVIJEST VEŽICA
    slug: povijest-vezica
    opis: Serijal o povijesti Vežice i istočne Rijeke – mjesta, ljudi i priče iz prošlosti.

# Rubrika "Izdvojeno" na naslovnici: 1 udarna vijest + po jedna vijest iz svake grupe kvartova
izdvojeno_grupe:
  - [Vežica]
  - [Trsat]
  - [Drenova]
  - [Sveta Katarina, Pašac]
  - [Istočna Rijeka]

# Kategorijski blokovi na MOBILNOJ naslovnici (redoslijed = redoslijed na stranici).
naslovnica_blokovi:
  - naslov: Vijesti
    id: vijesti
    ostale: true
    vise: /vijesti/
  - naslov: Poslovi grada
    id: poslovi-grada
    vrste: [Općinske vijesti]
    vise: /?kategorija=opcinske-vijesti
  - naslov: Zanimljivosti
    id: zanimljivosti
    vrste: [Zanimljivosti]
    vise: /?kategorija=zanimljivosti
  - naslov: Događanja
    id: dogadanja
    vrste: [Događanja]
    vise: /dogadaji/
  - naslov: Sport
    id: sport
    vrste: [Sport]
    vise: /?kategorija=sport
  - naslov: Crna kronika
    id: crna-kronika
    vrste: [Crna kronika]
    vise: /?kategorija=crna-kronika
  - naslov: Kultura
    id: kultura
    vrste: [Kultura]
    vise: /?kategorija=kultura
  - naslov: Društvo
    id: drustvo
    vrste: [Društvo]
    vise: /?kategorija=drustvo
  - naslov: Povijest Vežica
    id: povijest-vezica
    vrste: [Povijest]
    vise: /povijest/
